<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スマホ返却リマインダー作成 - てるランド野田店</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", "Segoe UI", sans-serif; padding: 20px 15px; max-width: 480px; margin: auto; line-height: 1.6; color: #333; background-color: #f4f6f8; }
    .card { background: #fff; padding: 24px 20px; border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    h2 { text-align: center; font-size: 1.25rem; margin-top: 0; margin-bottom: 20px; color: #1a73e8; }
    .form-group { margin-bottom: 18px; width: 100%; }
    label { font-weight: bold; display: block; margin-bottom: 6px; font-size: 0.95rem; color: #444; }
    input[type="date"], select { width: 100%; height: 48px; padding: 0 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; background-color: #fff; appearance: none; -webkit-appearance: none; }
    select { background-image: url('data:image/svg+xml;utf8,<svg fill="%23666" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>'); background-repeat: no-repeat; background-position: right 10px center; }
    .btn-submit { width: 100%; height: 50px; font-size: 16px; font-weight: bold; color: white; background-color: #1a73e8; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; transition: background-color 0.2s; }
    .btn-submit:active { background-color: #1557b0; }
    .result-box { margin-top: 25px; padding: 16px; border-radius: 10px; background: #e8f0fe; border: 1px solid #aecbfa; display: none; }
    .result-title { font-weight: bold; margin-bottom: 8px; color: #1967d2; }
    .store-info { margin-top: 20px; padding-top: 15px; border-top: 1px dashed #ccc; font-size: 0.85rem; color: #555; }
    .cal-btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 48px; font-size: 15px; font-weight: bold; color: white; border-radius: 8px; text-decoration: none; margin-top: 10px; border: none; cursor: pointer; }
    .btn-google { background-color: #4285F4; }
    .btn-ics { background-color: #34A853; }
  </style>
</head>
<body>

  <div class="card">
    <h2>📱 返却リマインダー登録</h2>

    <div class="form-group">
      <label for="contractDate">契約日（購入日）</label>
      <input type="date" id="contractDate">
    </div>

    <div class="form-group">
      <label for="monthSelect">通知する時期</label>
      <select id="monthSelect"></select>
    </div>

    <button class="btn-submit" onclick="generateCalendarLinks()">カレンダー登録リンクを作成</button>

    <div id="resultBox" class="result-box">
      <div class="result-title">📅 設定予定内容</div>
      <p id="summaryText" style="margin: 0 0 15px 0; font-size: 0.95rem;"></p>
      
      <a id="googleCalLink" href="#" target="_blank" style="text-decoration: none;">
        <button class="cal-btn btn-google">Googleカレンダーに追加</button>
      </a>
      <button class="cal-btn btn-ics" onclick="downloadIcs()">iPhone / カレンダーアプリに追加 (.ics)</button>
    </div>

    <div class="store-info">
      <strong>【お問い合わせ先】</strong><br>
      てるランド野田店<br>
      📞 TEL: 04-7199-4911<br>
      ⏰ 営業時間: 10:00 〜 20:00
    </div>
  </div>

  <script>
    const storeName = "てるランド野田店";
    const storeTel = "04-7199-4911";
    const storeHours = "10:00〜20:00";

    document.getElementById('contractDate').valueAsDate = new Date();

    const select = document.getElementById('monthSelect');
    for (let i = 1; i <= 48; i++) {
      const opt = document.createElement('option');
      opt.value = i;
      if (i === 23) {
        opt.textContent = `${i}か月目（標準・おすすめ）`;
        opt.selected = true;
      } else {
        opt.textContent = `${i}か月目`;
      }
      select.appendChild(opt);
    }

    let globalIcsData = "";

    function generateCalendarLinks() {
      const contractInput = document.getElementById('contractDate').value;
      if (!contractInput) {
        alert("契約日を選択してください");
        return;
      }

      const addMonths = parseInt(document.getElementById('monthSelect').value);
      const parts = contractInput.split('-');
      const year = parseInt(parts[0], 10);
      const month = parseInt(parts[1], 10) - 1;

      const targetDate = new Date(year, month + addMonths, 1);
      const targetYear = targetDate.getFullYear();
      const targetMonth = targetDate.getMonth();

      const startDate = new Date(targetYear, targetMonth, 3, 12, 30, 0);
      const endDate = new Date(targetYear, targetMonth, 3, 13, 0, 0);

      function formatLocalTime(d) {
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        const hh = String(d.getHours()).padStart(2, '0');
        const mi = String(d.getMinutes()).padStart(2, '0');
        return `${yyyy}${mm}${dd}T${hh}${mi}00`;
      }

      function formatDateOnly(yyyy, mm, dd) {
        const m = String(mm + 1).padStart(2, '0');
        const d = String(dd).padStart(2, '0');
        return `${yyyy}${m}${d}`;
      }

      const startLocal = formatLocalTime(startDate);
      const endLocal = formatLocalTime(endDate);
      const untilDateStr = formatDateOnly(targetYear, targetMonth, 25);

      const descriptionText = `スマホ返却・更新手続きの受付期間です。\n店頭（${storeName}）にてご相談をお受けしております。\n\n【店舗情報】\n${storeName}\nTEL: ${storeTel}\n営業時間: ${storeHours}`;

      const title = encodeURIComponent("【スマホ返却】手続き・次回機種変更のご確認");
      const details = encodeURIComponent(descriptionText);
      const location = encodeURIComponent(storeName);

      const recurParam = encodeURIComponent(`RRULE:FREQ=DAILY;UNTIL=${untilDateStr}T235959Z`);
      const googleUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${startLocal}/${endLocal}&details=${details}&location=${location}&recur=${recurParam}`;

      globalIcsData = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//TelTelLand//NONSGML Calendar//EN",
        "BEGIN:VEVENT",
        "SUMMARY:【スマホ返却】手続き・次回機種変更のご確認",
        "DESCRIPTION:" + descriptionText.replace(/\n/g, "\\n"),
        `LOCATION:${storeName}`,
        `DTSTART:${startLocal}`,
        `DTEND:${endLocal}`,
        `RRULE:FREQ=DAILY;UNTIL=${untilDateStr}T235959Z`,
        "BEGIN:VALARM",
        "TRIGGER:PT0M",
        "ACTION:DISPLAY",
        "DESCRIPTION:Reminder",
        "END:VALARM",
        "END:VEVENT",
        "END:VCALENDAR"
      ].join("\r\n");

      document.getElementById('summaryText').innerHTML = `<strong>${addMonths}か月目</strong> の通知設定<br>（${targetYear}年${targetMonth + 1}月3日 〜 25日の毎日12:30）`;
      document.getElementById('googleCalLink').href = googleUrl;
      document.getElementById('resultBox').style.display = 'block';
    }

    function downloadIcs() {
      if (!globalIcsData) return;
      const blob = new Blob([globalIcsData], { type: 'text/calendar;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = window.URL.createObjectURL(blob);
      link.setAttribute('download', 'smartphone_reminder.ics');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>

</body>
</html>
