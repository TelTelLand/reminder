<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スマホ返却リマインダー登録（TelTelLand）</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; line-height: 1.6; }
    .form-group { margin-bottom: 15px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; }
    input, select, button { width: 100%; padding: 10px; font-size: 16px; box-sizing: border-box; }
    button { background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    button:hover { background-color: #0056b3; }
    .result-box { margin-top: 20px; padding: 15px; border: 1px solid #ccc; background: #f9f9f9; border-radius: 5px; display: none; }
  </style>
</head>
<body>

  <h2>📱 スマホ返却リマインダー作成</h2>

  <div class="form-group">
    <label for="contractDate">契約日（購入日）:</label>
    <input type="date" id="contractDate">
  </div>

  <div class="form-group">
    <label for="monthSelect">通知タイミング:</label>
    <select id="monthSelect">
      <option value="23" selected>23ヶ月目（おすすめ）</option>
      <option value="24">24ヶ月目</option>
    </select>
  </div>

  <button onclick="generateCalendarLinks()">カレンダー登録リンクを作成</button>

  <div id="resultBox" class="result-box">
    <p><strong>【設定内容】</strong><br><span id="summaryText"></span></p>
    <a id="googleCalLink" href="#" target="_blank"><button style="background-color: #4285F4;">Googleカレンダーに追加</button></a>
    <button onclick="downloadIcs()" style="background-color: #34A853; margin-top: 10px;">iPhone / 汎用 (.ics) で追加</button>
  </div>

  <script>
    // 初期値として本日の日付をセット
    document.getElementById('contractDate').valueAsDate = new Date();

    let globalIcsData = "";

    function generateCalendarLinks() {
      const contractInput = document.getElementById('contractDate').value;
      if (!contractInput) {
        alert("契約日を入力してください");
        return;
      }

      const addMonths = parseInt(document.getElementById('monthSelect').value);
      const contractDate = new Date(contractInput);

      // 開始日：指定月数の3日 12:30
      const startDate = new Date(contractDate.getFullYear(), contractDate.getMonth() + addMonths, 3, 12, 30, 0);
      
      // 終了日（繰り返しの最終日）：指定月数の25日 13:00（※イベント終了時刻）
      const endDate = new Date(contractDate.getFullYear(), contractDate.getMonth() + addMonths, 25, 13, 0, 0);
      // RRULE用UNTIL日付（UTC変換）
      const untilDate = new Date(contractDate.getFullYear(), contractDate.getMonth() + addMonths, 25, 23, 59, 59);

      // 日付フォーマット関数 (YYYYMMDDTHHmmssZ)
      function formatDateUTC(date) {
        return date.toISOString().replace(/-|:|\.\d\d\d/g, "");
      }
      function formatDateLocal(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        const hh = String(date.getHours()).padStart(2, '0');
        const mm = String(date.getMinutes()).padStart(2, '0');
        return `${y}${m}${d}T${hh}${mm}00`;
      }

      const startLocal = formatDateLocal(startDate);
      const endLocal = formatDateLocal(new Date(contractDate.getFullYear(), contractDate.getMonth() + addMonths, 3, 13, 0, 0));
      const untilUTC = formatDateUTC(untilDate);

      const title = encodeURIComponent("【スマホ返却】手続き・次回機種変更のご確認");
      const details = encodeURIComponent(`スマホ返却・更新手続きの受付期間です。\n店頭（てるランド新狭山店）にてご相談をお受けしております。`);
      const location = encodeURIComponent("てるランド新狭山店");

      // Google Calendar Link (RRULE: FREQ=DAILY;UNTIL=...)
      const rrule = `FREQ=DAILY;UNTIL=${untilUTC}`;
      const googleUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${startLocal}/${endLocal}&details=${details}&location=${location}&recur=RRULE:${rrule}`;

      // ICS Data (for iPhone / Outlook)
      globalIcsData = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//TelTelLand//NONSGML Calendar//EN",
        "BEGIN:VEVENT",
        `SUMMARY:【スマホ返却】手続き・次回機種変更のご確認`,
        `DESCRIPTION:スマホ返却・更新手続きの受付期間です。店頭にてご相談をお受けしております。`,
        `LOCATION:てるランド新狭山店`,
        `DTSTART:${startLocal}`,
        `DTEND:${endLocal}`,
        `RRULE:FREQ=DAILY;UNTIL=${untilUTC}`,
        "END:VEVENT",
        "END:VCALENDAR"
      ].join("\n");

      // 表示更新
      const startStr = `${startDate.getFullYear()}年${startDate.getMonth() + 1}月3日`;
      const endStr = `${startDate.getFullYear()}年${startDate.getMonth() + 1}月25日`;
      document.getElementById('summaryText').innerText = `${addMonths}ヶ月目（${startStr} 〜 ${endStr} の毎日12:30に通知）`;
      
      document.getElementById('googleCalLink').href = googleUrl;
      document.getElementById('resultBox').style.display = 'block';
    }

    function downloadIcs() {
      if (!globalIcsData) return;
      const blob = new Blob([globalIcsData], { type: 'text/calendar;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = window.URL.createObjectURL(blob);
      link.setAttribute('download', 'smartphone_reminder.ics');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>

</body>
</html>
